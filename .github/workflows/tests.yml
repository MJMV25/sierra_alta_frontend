# Pruebas y cobertura del frontend. Corre en cada push (cualquier rama) y en cada pull request:
# instala dependencias exactas (npm ci), ejecuta las pruebas con cobertura (Vitest + v8), compila la
# aplicación y publica el reporte de cobertura como artefacto, con un resumen en la página de la ejecución.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que siga en curso.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas, cobertura y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lineas: ${{ steps.porcentaje.outputs.lineas }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar y medir cobertura
        # Genera coverage/ (index.html, lcov.info, coverage-summary.json).
        run: npm run test:coverage

      - name: Compilar
        run: npm run build

      - name: Porcentaje de líneas cubiertas
        id: porcentaje
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e 'console.log("lineas=" + require("./coverage/coverage-summary.json").total.lines.pct.toFixed(1))' >> "$GITHUB_OUTPUT"

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No se generó el reporte de cobertura (revise el paso de pruebas)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (name, m) => `| ${name} | ${m.pct.toFixed(1)} % | ${m.covered} / ${m.total} |`;
            console.log([
              "## Cobertura del frontend (Vitest + v8)", "",
              "| Métrica | Cobertura | Cubiertas / total |", "| --- | ---: | ---: |",
              row("Líneas", t.lines), row("Ramas", t.branches), row("Sentencias", t.statements), row("Funciones", t.functions),
              "", "Mínimo exigido: 80 % de líneas (coverage.thresholds en vite.config.js); por debajo, el pipeline falla.",
              "", "Reporte completo: artefacto **cobertura-frontend** (abra index.html).",
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  # Badge de cobertura del README: en cada push a main publica coverage.json (formato de shields.io)
  # en la rama `badges`, que solo guarda ese archivo. Sin servicios externos ni secretos.
  badge:
    name: Badge de cobertura
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.outputs.lineas != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publicar coverage.json en la rama badges
        env:
          LINEAS: ${{ needs.tests.outputs.lineas }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$LINEAS" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir badges && cd badges
          git init -q -b badges
          printf '{"schemaVersion":1,"label":"cobertura","message":"%s %%","color":"%s"}\n' "$LINEAS" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badge de cobertura: $LINEAS % de líneas (${GITHUB_SHA::7})"
          # La rama tiene un solo commit: se reemplaza en cada publicación.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
